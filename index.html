<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Master Set Tracker</title>

  <!-- Pokémon/Arcade Stylized Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,700;1,700&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">

  <style>
    /* Base Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f1117;
      color: #f0f4f8;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    #status-msg {
      font-size: 0.9rem;
      color: #9ba1b0;
      margin-bottom: 15px;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background-color: #1a1d26;
      padding: 15px;
      border-radius: 8px;
      align-items: center;
      margin-bottom: 15px;
      border: 1px solid #2b303d;
    }

    select, input[type="text"], button {
      background-color: #262a36;
      color: #ffffff;
      border: 1px solid #3b4050;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: #4c82f6;
    }

    input[type="text"] {
      flex-grow: 1;
      min-width: 200px;
    }

    button {
      background-color: #3b82f6;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2563eb;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      background-color: #1a1d26;
      border-radius: 20px;
      height: 24px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
      border: 1px solid #2b303d;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* View Switcher Controls */
    .view-switcher {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-view {
      padding: 8px 18px;
      font-size: 0.9rem;
      border-radius: 6px;
      background-color: #1a1d26;
      border: 1px solid #3b4050;
      color: #9ba1b0;
    }

    .btn-view.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
    }

    /* 2D Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      width: 100%;
    }

    .card-item {
      background-color: #1a1d26;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
    }

    .card-item:hover {
      transform: translateY(-4px);
    }

    /* OWNED / COLLECTED */
    .card-item.owned {
      border-color: #10b981;
      background-color: #122820;
    }

    .card-item.owned img {
      filter: none;
      opacity: 1;
    }

    /* MISSING / UNCOLLECTED */
    .card-item.missing {
      border-color: #2b303d;
      background-color: #14171f;
    }

    .card-item.missing img {
      filter: grayscale(100%) brightness(35%);
      opacity: 0.6;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }

    .card-item.missing:hover img {
      filter: grayscale(40%) brightness(75%);
      opacity: 0.85;
    }

    .card-item img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      display: block;
    }

    /* 3D Scene Viewport Wrapper */
    #three-wrapper {
      position: relative;
      display: none;
      width: 100%;
      height: 620px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2b303d;
      background-color: #0e1015;
    }

    #three-container {
      width: 100%;
      height: 100%;
    }

    .three-toolbar {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    .btn-3d-tool {
      background-color: rgba(26, 29, 38, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid #3b4050;
      color: #f0f4f8;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-3d-tool.active {
      background-color: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    /* 3D Bottom Center HUD Badge */
    .three-bottom-hud {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: auto;
    }

    .card-number-badge {
      background: linear-gradient(180deg, #2a2e3d 0%, #151821 100%);
      border: 2px solid #ffcb05; /* Pokémon Yellow */
      box-shadow: 0 0 15px rgba(255, 203, 5, 0.4), inset 0 0 8px rgba(0, 0, 0, 0.6);
      color: #ffcb05;
      font-family: 'Orbitron', 'Chakra Petch', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 6px 20px;
      border-radius: 20px;
      cursor: pointer;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 8px rgba(255, 203, 5, 0.6);
      transition: all 0.2s ease;
      min-width: 90px;
      text-align: center;
      user-select: none;
    }

    .card-number-badge:hover {
      transform: scale(1.06);
      box-shadow: 0 0 22px rgba(255, 203, 5, 0.7);
      border-color: #ffffff;
      color: #ffffff;
    }

    .card-number-input {
      display: none;
      background: #0e1015;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      text-align: center;
      width: 100px;
      outline: none;
    }

    .hud-hint {
      font-size: 0.7rem;
      color: #9ba1b0;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Card Details Legend Modal */
    #card-detail-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: #1a1d26;
      border: 1px solid #3b4050;
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2b303d;
      padding-bottom: 10px;
    }

    .modal-header h2 {
      font-size: 1.3rem;
      color: #fff;
    }

    .btn-close-modal {
      background: transparent;
      border: none;
      color: #9ba1b0;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 5px;
    }

    .btn-close-modal:hover {
      color: #fff;
    }

    .modal-body {
      display: flex;
      gap: 18px;
    }

    .modal-card-img {
      width: 150px;
      border-radius: 8px;
      border: 1px solid #3b4050;
      object-fit: contain;
    }

    .modal-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
      justify-content: center;
    }

    .modal-row {
      display: flex;
      flex-direction: column;
    }

    .modal-label {
      font-size: 0.75rem;
      color: #9ba1b0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-value {
      font-weight: 600;
      color: #f0f4f8;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Pokémon Master Set Tracker</h1>
      <p id="status-msg">Select a set or type a Pokémon name to get started.</p>
    </header>

    <!-- Controls Header -->
    <div class="controls">
      <select id="set-select">
        <option value="">-- Select a Set --</option>
      </select>

      <input type="text" id="search-input" placeholder="Search Pokémon (e.g. Charizard, Gengar)...">

      <label class="checkbox-group">
        <input type="checkbox" id="toggle-missing" checked> Show Missing Cards
      </label>

      <button id="btn-sync">Sync Set Data</button>
    </div>

    <!-- Collection Progress Bar -->
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
      <div id="progress-text" class="progress-text">0 / 0 Cards Collected (0%)</div>
    </div>

    <!-- 2D vs 3D View Switcher -->
    <div class="view-switcher">
      <button id="btn-view-2d" class="btn-view active">2D Grid</button>
      <button id="btn-view-3d" class="btn-view">3D Carousel</button>
    </div>

    <!-- 2D Card Grid -->
    <div id="card-gallery" class="gallery-grid"></div>

    <!-- 3D Scene Viewport Wrapper -->
    <div id="three-wrapper">
      <div class="three-toolbar">
        <button id="btn-lock-camera" class="btn-3d-tool active">🔒 Lock Plane: On</button>
        <button id="btn-reset-view" class="btn-3d-tool">🎯 Reset View</button>
      </div>

      <!-- Bottom Center Pokémon Font Badge -->
      <div class="three-bottom-hud">
        <div id="hud-card-badge" class="card-number-badge" title="Click to jump to card number">#---</div>
        <input type="text" id="hud-card-input" class="card-number-input" placeholder="e.g. 43" maxlength="8">
        <span class="hud-hint">Click number to jump</span>
      </div>

      <div id="three-container"></div>
    </div>
  </div>

  <!-- Card Details Information Legend Modal -->
  <div id="card-detail-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-card-name">Card Details</h2>
        <button class="btn-close-modal" id="btn-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <img id="modal-card-img" class="modal-card-img" src="" alt="Card Artwork">
        <div class="modal-details">
          <div class="modal-row">
            <span class="modal-label">Set Name</span>
            <span class="modal-value" id="modal-set-name">-</span>
          </div>
          <div class="modal-row">
            <span class="modal-label">Card Number</span>
            <span class="modal-value" id="modal-card-number">-</span>
          </div>
          <div class="modal-row">
            <span class="modal-label">Database ID</span>
            <span class="modal-value" id="modal-card-id">-</span>
          </div>
          <div class="modal-row">
            <span class="modal-label">Status</span>
            <span class="modal-value" id="modal-status">-</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-modal-toggle-own" style="width: 100%; padding: 10px;">Toggle Owned</button>
      </div>
    </div>
  </div>

  <!-- Dexie.js for IndexedDB Caching -->
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

  <!-- Three.js Engine & Controls for 3D Carousel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Application Logic -->
  <script src="app-v2.js?v=hud_jump_fixed_v1"></script>

</body>
</html>
